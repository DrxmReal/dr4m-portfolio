<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Holy Cross -->
  <g fill="#FFD700" stroke="#000" stroke-width="2">
    <!-- Vertical bar -->
    <rect x="40" y="15" width="20" height="70" rx="2"/>
    <!-- Horizontal bar -->
    <rect x="20" y="40" width="60" height="20" rx="2"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="50" cy="15" r="4" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
  <circle cx="50" cy="85" r="4" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
  <circle cx="20" cy="50" r="4" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
  <circle cx="80" cy="50" r="4" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
</svg>