<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Skull -->
  <g fill="#FFD700" stroke="#000" stroke-width="1.5">
    <!-- Main skull -->
    <circle cx="50" cy="40" r="25"/>
    <!-- Jaw -->
    <rect x="30" y="60" width="40" height="15" rx="3"/>
    <!-- Left eye socket -->
    <circle cx="38" cy="35" r="6" fill="#000"/>
    <!-- Right eye socket -->
    <circle cx="62" cy="35" r="6" fill="#000"/>
    <!-- Nose hole -->
    <ellipse cx="50" cy="50" rx="3" ry="4" fill="#000"/>
  </g>
</svg>