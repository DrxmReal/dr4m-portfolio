<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Holy cross -->
  <g fill="#FFFFFF" stroke="#000" stroke-width="2">
    <!-- Vertical bar -->
    <rect x="40" y="10" width="20" height="80" rx="2"/>
    <!-- Horizontal bar -->
    <rect x="20" y="35" width="60" height="20" rx="2"/>
  </g>
  <!-- Decorative circles at ends -->
  <circle cx="50" cy="10" r="4" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
  <circle cx="50" cy="90" r="4" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
  <circle cx="20" cy="45" r="4" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
  <circle cx="80" cy="45" r="4" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
</svg>